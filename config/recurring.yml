# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Purges the trash.
  #
  # Hourly by default, so a computer that is off at night still purges.
  # HOME_OFFICE_PURGE_SCHEDULE takes any Solid Queue schedule ("every day at
  # 3am", a cron line); an empty value means the default. The value is written
  # as JSON so YAML reads it as one string whatever it holds (a cron line starts
  # with a star).
  purge_trash:
    class: Core::PurgeTrashJob
    schedule: <%= (ENV["HOME_OFFICE_PURGE_SCHEDULE"].presence || "every hour").to_json %>

  # Makes the past occurrences of series into events, only when
  # HOME_OFFICE_CATCH_UP is `job`. Minute 5, so it does not start together with
  # the purge.
  #
  # HOME_OFFICE_CATCH_UP_SCHEDULE takes any Solid Queue schedule.
<% if Core::CatchUpMode.job? %>
  catch_up:
    class: Core::CatchUpJob
    schedule: <%= (ENV["HOME_OFFICE_CATCH_UP_SCHEDULE"].presence || "every hour at minute 5").to_json %>
<% end %>
