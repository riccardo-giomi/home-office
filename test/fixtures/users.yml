<% digest = BCrypt::Password.create(TEST_PASSWORD, cost: BCrypt::Engine::MIN_COST) %>

admin:
  email_address: admin@example.com
  password_digest: <%= digest %>
  role: admin

other_admin:
  email_address: other-admin@example.com
  password_digest: <%= digest %>
  role: admin

member:
  email_address: member@example.com
  password_digest: <%= digest %>
  role: user

retired:
  email_address: retired@example.com
  password_digest: <%= digest %>
  role: user
  deactivated_at: <%= 5.days.ago.to_fs(:db) %>
