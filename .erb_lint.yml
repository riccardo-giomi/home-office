---
# The files of installed gems are not ours to lint. A CI run installs the gems
# inside the project, in vendor/bundle.
exclude:
  - vendor/**/*
  - node_modules/**/*
EnableDefaultLinters: true
linters:
  ErbSafetyLinter:
    enabled: false
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_gem:
        standard: config/base.yml
      # ERB files are fragments: these two layout cops are artefacts of that, not findings
      Layout/InitialIndentation:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
