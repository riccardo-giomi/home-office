<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Change not made | Home Office</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #ffffff;
        --text: #1b1f27;
        --link: #3a65b8;
        --line: #e4e6ea;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1a1d22;
          --text: #e2e5e9;
          --link: #719def;
          --line: #2d3137;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--page);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: 100%;
        max-width: 32rem;
        padding: 1.5rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }

      .brand {
        margin: 0 0 1rem;
        font-size: 0.875rem;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      p {
        margin: 0 0 1rem;
      }

      a {
        display: inline-block;
        padding: 0.5rem 0;
        color: var(--link);
        font-weight: 600;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Home Office</p>
      <h1>That change could not be made</h1>
      <p>The page may have expired, or the request was refused. Go back, reload the page and try again.</p>
      <a href="/">Back to Home Office</a>
    </main>
  </body>
</html>
